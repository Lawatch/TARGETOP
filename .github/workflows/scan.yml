name: Radar scan
# Chaque run scanne en boucle toutes les ~7 min pendant ~5h50 (le cron GitHub est souvent en retard ou sauté).
# Le cron (toutes les 15 min) et chaque push relancent la boucle si besoin ; le plus récent remplace le précédent
# (cancel-in-progress), ce qui déploie aussi immédiatement le nouveau code poussé par les agents.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    paths: ['src/**', 'web/**', 'config/**', 'reports/**', 'docs/**', '.github/workflows/scan.yml']

permissions:
  contents: write

concurrency:
  group: radar-scan
  cancel-in-progress: true

jobs:
  scan:
    # Uniquement sur la branche par défaut (les branches de travail ne doivent pas écrire les données live)
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 358
    env:
      LOOP_MINUTES: 345
      INTERVAL_SECONDS: 420
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests du moteur
        run: npm test
      - name: Récupérer l'état live (branche gh-pages)
        env:
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          if git ls-remote --exit-code --heads "$REPO_URL" gh-pages >/dev/null; then
            git clone --depth 1 --branch gh-pages "$REPO_URL" site
          else
            mkdir site && git -C site init -b gh-pages && git -C site remote add origin "$REPO_URL"
          fi
          git -C site config user.name "targetop-radar"
          git -C site config user.email "targetop-radar@users.noreply.github.com"
      - name: Boucle scan Kraken + paper-trading + publication
        run: |
          end=$(( $(date +%s) + LOOP_MINUTES * 60 ))
          while :; do
            start=$(date +%s)
            if node src/scan.mjs --data site/data && node src/build-site.mjs site; then
              (cd site && git add -A && git commit -q -m "scan $(date -u +%Y-%m-%dT%H:%MZ)" && \
                for i in 1 2 3 4; do git push -q origin gh-pages && break; sleep $((2**i)); done) || echo "rien à publier / push échoué"
            else
              echo "::warning::scan en échec, nouvel essai au prochain tour"
            fi
            next=$(( start + INTERVAL_SECONDS ))
            [ "$next" -ge "$end" ] && break
            sleep $(( next - $(date +%s) > 0 ? next - $(date +%s) : 1 ))
          done
